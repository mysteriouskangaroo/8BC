name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# CI assembles source and runs boot-free checks. It never reads original CPU
# or sound ROMs. PinMAME boot/game tests remain local because they need sounds.
# Public artifacts contain reports and symbols only, never ROMs or listings.
jobs:
  doc-paths:
    name: Documentation paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - shell: pwsh
        run: ./tools/Test-DocPaths.ps1

  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Rosetta for the x86-64 DASM binary
        if: runner.os == 'macOS'
        shell: bash
        run: /usr/bin/arch -x86_64 /usr/bin/true || sudo softwareupdate --install-rosetta --agree-to-license
      - name: Fetch pinned DASM
        run: ./tools/Get-Dasm.ps1
      - name: Canonical source build
        run: ./src/originals/asm/build.ps1 -SkipPackaging
      - name: Deluxe source build
        run: ./src/8bc-deluxe/asm/build.ps1 -SkipPackaging
      - name: Runner checker (no ROM inputs)
        run: ./tools/Test-GameTestRunner.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: build-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            src/*/build/verification.txt
            src/*/build/*.sym

  windows-ps51:
    name: Build under Windows PowerShell 5.1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - shell: pwsh
        run: ./tools/Get-Dasm.ps1
      - name: Build both source trees with powershell.exe
        shell: pwsh
        run: |
          foreach ($tree in 'originals', '8bc-deluxe') {
              & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "src/$tree/asm/build.ps1" -SkipPackaging
              if ($LASTEXITCODE -ne 0) { throw "$tree build failed under Windows PowerShell 5.1 (exit $LASTEXITCODE)" }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: build-ps51
          if-no-files-found: warn
          path: |
            src/*/build/verification.txt
            src/*/build/*.sym
