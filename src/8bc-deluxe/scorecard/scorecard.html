<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Eight Ball Champ Deluxe scorecard: Called Ball, Progressive Collect, extended Bonus X Saucer progression, end-of-ball bonus, and major Special rules.">
  <title>Eight Ball Champ Deluxe Scorecard</title>
  <style>
    @page {
      size: 6in 3.25in;
      margin: 0;
    }

    html,
    body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #0a2731;
      box-sizing: border-box;
      print-color-adjust: exact;
      -webkit-print-color-adjust: exact;
    }

    object {
      display: block;
      width: 100vw;
      height: 100vh;
      border: 0;
    }

    @media print {
      html,
      body,
      object {
        width: 6in;
        height: 3.25in;
      }
    }
  </style>
</head>
<body>
  <object
    data="scorecard.svg"
    type="image/svg+xml"
    aria-label="Eight Ball Champ Deluxe player rules scorecard. C-H-A-M-P completions award right pop 3K, 2X playfield, left pop 3K, 3X playfield, then outlane Specials plus a 30K base times playfield; later completions score another 30K base times playfield, and the progression resets each ball. Complete B-A-L-L for an extra ball and Specials. Complete 2 or more racks for Specials. All Specials score 250K times the current playfield multiplier. Called Ball starts at 5K, adds 5K for each make up to a maximum of 50K, and its value carries between drains. Progressive Collect repeats between orbits and the spinner; sink a new ball to light each stage. In the orbits stage, the left collects and advances 10K, while the right collects and advances 20K. Advancement stops at 100K and lights a Special. The value carries between drains. At the spinner, E-I-G-H-T increases the value, with a maximum of 9K per spin. The value resets between drains. The Bonus X Saucer advances automatically from 2X to 3X to 5X to the first 100K. After that, complete Progressive Collect before each next saucer award: 7X plus 100K, 8X plus 100K, 10X plus 100K, then repeatable 100K. End-of-ball bonus awards 15K per pool ball sunk and 120K per rack, plus 10K per E-I-G-H-T and 50K per B-A-L-L. The value carries between drains."
  >
    <p>
      C-H-A-M-P completions award right pop 3K, 2X playfield, left pop 3K,
      3X playfield, then outlane Specials plus a 30K base times playfield;
      later completions score another 30K base times playfield, and the
      progression resets each ball. All Specials score
      250K times the current playfield multiplier. Complete B-A-L-L for an
      extra ball and Specials. Complete 2 or more racks for Specials. Called Ball starts at
      5K, adds 5K for each successful make up to a maximum of 50K, and its
      value carries between drains. Progressive Collect repeats
      between orbits and the spinner; sink a new ball to light each stage.
      The left orbit collects the current value and advances it by 10K, while
      the right collects and advances it by 20K. Advancement stops at 100K,
      which lights a Special.
      The orbit value carries between drains. E-I-G-H-T increases the spinner
      value to a maximum of 9K per spin, and the spinner value resets between drains.
      The Bonus X Saucer advances automatically from 2X to 3X to 5X to the
      first 100K. After that, complete Progressive Collect before each next
      saucer award: 7X plus 100K, 8X plus 100K, 10X plus 100K, then repeatable
      100K.
      End-of-ball bonus awards 15K per pool ball sunk and 120K per rack, plus 10K per
      E-I-G-H-T and 50K per B-A-L-L. The value carries between drains.
    </p>
  </object>
</body>
</html>
