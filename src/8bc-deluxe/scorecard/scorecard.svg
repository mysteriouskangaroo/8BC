<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="6in" height="3.25in" viewBox="0 0 1800 975" role="img" aria-labelledby="title desc">
  <title id="title">Eight Ball Champ Deluxe rules scorecard</title>
  <desc id="desc">A six inch by three and one quarter inch printable player rules card with a transparent Eight Ball Champ Deluxe title treatment.</desc>

  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a2c12"/>
      <stop offset="0.48" stop-color="#371b0d"/>
      <stop offset="1" stop-color="#1d110a"/>
    </linearGradient>
    <linearGradient id="felt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#176d31"/>
      <stop offset="1" stop-color="#073d1d"/>
    </linearGradient>
    <pattern id="woodLines" width="150" height="80" patternUnits="userSpaceOnUse">
      <path d="M0,18 C35,2 78,34 150,12 M0,61 C48,40 95,78 150,49" fill="none" stroke="#a25a20" stroke-width="4" opacity="0.14"/>
    </pattern>
    <filter id="shadow" x="-12%" y="-18%" width="130%" height="145%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#000000" flood-opacity="0.78"/>
    </filter>
    <filter id="logoShadow" x="-20%" y="-30%" width="150%" height="170%">
      <feDropShadow dx="5" dy="6" stdDeviation="2" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
    <clipPath id="playerClip">
      <rect x="40" y="590" width="1720" height="346" rx="10"/>
    </clipPath>
    <style>
      .rule-title { font-family: "Arial Black", Arial, sans-serif; font-size: 29px; font-weight: 900; letter-spacing: 1.1px; fill: #ffbd31; }
      .rule-body { font-family: Arial, Helvetica, sans-serif; font-size: 21px; font-weight: 800; fill: #fff2c2; }
      .rule-small { font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: 800; fill: #fff2c2; }
      .accent { fill: #ff7a25; font-weight: 900; }
      .gold { fill: #ffd65b; font-weight: 900; }
      .number { font-family: "Arial Black", Arial, sans-serif; font-size: 27px; font-weight: 900; text-anchor: middle; dominant-baseline: middle; fill: #17110b; }
      .value { font-family: "Arial Black", Arial, sans-serif; font-size: 20px; font-weight: 900; text-anchor: middle; dominant-baseline: middle; fill: #fff3c7; }
      .value-arrow { font-family: "Arial Black", Arial, sans-serif; font-size: 28px; font-weight: 900; text-anchor: middle; dominant-baseline: middle; fill: #ff9a25; }
    </style>
  </defs>

  <!-- Backglass-inspired cabinet border and tavern field -->
  <rect width="1800" height="975" fill="#050706"/>
  <rect x="12" y="12" width="1776" height="951" rx="19" fill="url(#wood)" stroke="#ef9f21" stroke-width="11"/>
  <rect x="28" y="28" width="1744" height="919" rx="13" fill="none" stroke="#070807" stroke-width="10"/>
  <rect x="41" y="41" width="1718" height="893" rx="8" fill="none" stroke="#f8c33a" stroke-width="5"/>
  <rect x="51" y="51" width="1698" height="873" fill="url(#woodLines)" stroke="#e54b18" stroke-width="5"/>

  <!-- Compact left-aligned masthead leaves the full lower third available for the player art. -->
  <image href="scorecard-title.png" x="90" y="5" width="1050" height="225" preserveAspectRatio="xMinYMid meet"/>

  <!-- Bally Midway fills the otherwise unused upper-right corner. -->
  <g transform="translate(1260 105)" filter="url(#logoShadow)">
    <text x="0" y="62" font-family="Brush Script MT, Segoe Script, cursive" font-size="76" font-style="italic" fill="#fff2c2">Bally</text>
    <text x="163" y="60" font-family="Arial Black, Arial, sans-serif" font-size="34" font-style="italic" letter-spacing="1" fill="#fff2c2">MIDWAY</text>
  </g>

  <!-- Six roomier rules panels, raised to enlarge the artwork window below. -->
  <g transform="translate(0 -100)">
  <g filter="url(#shadow)">
    <rect x="65" y="340" width="530" height="165" rx="16" fill="#083e20" fill-opacity="0.97" stroke="#e8921d" stroke-width="5"/>
    <rect x="635" y="340" width="530" height="165" rx="16" fill="#083e20" fill-opacity="0.97" stroke="#e8921d" stroke-width="5"/>
    <rect x="1205" y="340" width="530" height="165" rx="16" fill="#083e20" fill-opacity="0.97" stroke="#e8921d" stroke-width="5"/>
    <rect x="65" y="520" width="530" height="165" rx="16" fill="#083e20" fill-opacity="0.97" stroke="#e8921d" stroke-width="5"/>
    <rect x="635" y="520" width="530" height="165" rx="16" fill="#083e20" fill-opacity="0.97" stroke="#e8921d" stroke-width="5"/>
    <rect x="1205" y="520" width="530" height="165" rx="16" fill="#083e20" fill-opacity="0.97" stroke="#e8921d" stroke-width="5"/>
  </g>

  <!-- 1 ball: yellow -->
  <circle cx="111" cy="388" r="33" fill="#e8bd27" stroke="#17110b" stroke-width="5"/>
  <circle cx="111" cy="388" r="16" fill="#fff5d4"/>
  <circle cx="99" cy="376" r="6" fill="#ffffff" opacity="0.5"/>
  <text class="number" x="111" y="390">1</text>
  <text class="rule-title" x="155" y="398">C-H-A-M-P</text>
  <text class="rule-body" x="90" y="441">
    <tspan x="90">2 TIMES = </tspan><tspan class="accent">2X</tspan><tspan> • 4 TIMES = </tspan><tspan class="accent">3X PLAYFIELD</tspan>
    <tspan x="90" dy="34">6 TIMES = </tspan><tspan class="gold">OUTLANE SPECIALS • 750K</tspan>
  </text>

  <!-- 2 ball: blue -->
  <circle cx="681" cy="388" r="33" fill="#2764a5" stroke="#17110b" stroke-width="5"/>
  <circle cx="681" cy="388" r="16" fill="#fff5d4"/>
  <circle cx="669" cy="376" r="6" fill="#ffffff" opacity="0.5"/>
  <text class="number" x="681" y="390">2</text>
  <text class="rule-title" x="725" y="398">CALLED BALL</text>
  <text class="rule-body" x="660" y="434">
    <tspan x="660" class="gold">10K</tspan><tspan> TO START • </tspan><tspan class="accent">+10K EACH MAKE</tspan>
    <tspan x="660" dy="29">CARRIES FOR THE WHOLE GAME</tspan>
    <tspan x="660" dy="29">OTHER NEW BALLS: </tspan><tspan class="gold">2,500</tspan>
  </text>

  <!-- 3 ball: red -->
  <circle cx="1251" cy="388" r="33" fill="#c52d2d" stroke="#17110b" stroke-width="5"/>
  <circle cx="1251" cy="388" r="16" fill="#fff5d4"/>
  <circle cx="1239" cy="376" r="6" fill="#ffffff" opacity="0.5"/>
  <text class="number" x="1251" y="390">3</text>
  <text class="rule-title" x="1295" y="398">COLLECT</text>
  <text class="rule-body" x="1230" y="441">
    <tspan x="1230">SINK A NEW BALL TO LIGHT:</tspan>
    <tspan x="1230" dy="34" class="gold">RIGHT ORBIT → SPINNER → LEFT ORBIT</tspan>
  </text>

  <!-- 4 ball: purple -->
  <circle cx="111" cy="563" r="33" fill="#6b3f8f" stroke="#17110b" stroke-width="5"/>
  <circle cx="111" cy="563" r="16" fill="#fff5d4"/>
  <circle cx="99" cy="551" r="6" fill="#ffffff" opacity="0.5"/>
  <text class="number" x="111" y="565">4</text>
  <text class="rule-title" x="155" y="573">ADVANCE SPINNER</text>
  <text class="rule-body" x="90" y="616">
    <tspan x="90">EACH NEW </tspan><tspan class="accent">E-I-G-H-T</tspan><tspan> LETTER</tspan>
    <tspan x="90" dy="34">ADVANCES THE SPINNER VALUE.</tspan>
  </text>

  <!-- 5 ball: orange; discrete values with centered arrows -->
  <circle cx="681" cy="563" r="33" fill="#e47b22" stroke="#17110b" stroke-width="5"/>
  <circle cx="681" cy="563" r="16" fill="#fff5d4"/>
  <circle cx="669" cy="551" r="6" fill="#ffffff" opacity="0.5"/>
  <text class="number" x="681" y="565">5</text>
  <text class="rule-title" x="725" y="573">BONUS X</text>
  <g>
    <rect x="658" y="595" width="76" height="38" rx="19" fill="#165b31" stroke="#e8a020" stroke-width="3"/>
    <rect x="782" y="595" width="76" height="38" rx="19" fill="#165b31" stroke="#e8a020" stroke-width="3"/>
    <rect x="906" y="595" width="76" height="38" rx="19" fill="#165b31" stroke="#e8a020" stroke-width="3"/>
    <rect x="1030" y="595" width="108" height="38" rx="19" fill="#9f241e" stroke="#e8a020" stroke-width="3"/>
    <text class="value" x="696" y="615">2X</text>
    <text class="value-arrow" x="758" y="615">→</text>
    <text class="value" x="820" y="615">3X</text>
    <text class="value-arrow" x="882" y="615">→</text>
    <text class="value" x="944" y="615">5X</text>
    <text class="value-arrow" x="1006" y="615">→</text>
    <text class="value" x="1084" y="615">100K</text>
  </g>
  <text class="rule-small" x="660" y="668">COMPLETED COLLECT RELIGHTS <tspan class="accent">100K</tspan></text>

  <!-- 6 ball: green; four deliberately separated lines -->
  <circle cx="1251" cy="563" r="33" fill="#2f7d46" stroke="#17110b" stroke-width="5"/>
  <circle cx="1251" cy="563" r="16" fill="#fff5d4"/>
  <circle cx="1239" cy="551" r="6" fill="#ffffff" opacity="0.5"/>
  <text class="number" x="1251" y="565">6</text>
  <text class="rule-title" x="1295" y="573">END-OF-BALL BONUS</text>
  <text class="rule-small" x="1230" y="607">
    <tspan x="1230" class="gold">15K / BALL • 120K / RACK</tspan>
    <tspan x="1230" dy="23" class="gold">10K / E-I-G-H-T</tspan>
    <tspan x="1230" dy="23" class="gold">50K / B-A-L-L • ALL × BONUS X</tspan>
    <tspan x="1230" dy="23">COUNTS PAST 360K / SECOND L</tspan>
  </text>
  </g>

  <!-- Pool-table field and backglass-style player -->
  <g clip-path="url(#playerClip)">
    <path d="M40,654 Q430,568 885,620 Q1325,668 1760,574 V950 H40 Z" fill="url(#felt)" stroke="#f0a01e" stroke-width="8"/>
    <path d="M39,710 Q538,616 967,666 Q1356,713 1760,623" fill="none" stroke="#07100a" stroke-width="18" opacity="0.8"/>
    <image href="scorecard-pool-player.png" x="170" y="520" width="1250" height="417" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <path d="M63,868 H525 L553,899 525,930 H63 L92,899 Z" fill="#26140c" fill-opacity="0.9" stroke="#e99920" stroke-width="5"/>
  <text x="306" y="893" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="20" letter-spacing="2" fill="#ffbd35">WATCH THE LAMPS</text>
  <text x="306" y="918" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="17" letter-spacing="1.3" fill="#fff2c2">FOLLOW THE CALL • FINISH THE RACK</text>
</svg>
