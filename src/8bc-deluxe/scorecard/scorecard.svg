<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="6in" height="3.25in" viewBox="0 0 1800 975" role="img" aria-labelledby="title desc">
  <title id="title">Eight Ball Champ Deluxe rules scorecard</title>
  <desc id="desc">A six inch by three and one quarter inch printable player rules card with a transparent Eight Ball Champ Deluxe title treatment.</desc>

  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a2c12"/>
      <stop offset="0.48" stop-color="#371b0d"/>
      <stop offset="1" stop-color="#1d110a"/>
    </linearGradient>
    <pattern id="woodLines" width="150" height="80" patternUnits="userSpaceOnUse">
      <path d="M0,18 C35,2 78,34 150,12 M0,61 C48,40 95,78 150,49" fill="none" stroke="#a25a20" stroke-width="4" opacity="0.14"/>
    </pattern>
    <filter id="shadow" x="-12%" y="-18%" width="130%" height="145%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#000000" flood-opacity="0.78"/>
    </filter>
    <filter id="logoShadow" x="-20%" y="-30%" width="150%" height="170%">
      <feDropShadow dx="5" dy="6" stdDeviation="2" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
    <clipPath id="playerClip">
      <rect x="40" y="610" width="1720" height="308" rx="10"/>
    </clipPath>
    <clipPath id="tableExtensionClip">
      <rect x="1396" y="845" width="353" height="73"/>
    </clipPath>
    <style>
      .rule-title { font-family: "Arial Black", Arial, sans-serif; font-size: 29px; font-weight: 900; letter-spacing: 1.1px; fill: #ffbd31; }
      .section-title { font-family: "Arial Black", Arial, sans-serif; font-size: 24px; font-weight: 900; fill: #ffbd31; }
      .rule-copy { font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: 800; fill: #fff2c2; }
      .indicator-count { font-family: "Arial Black", Arial, sans-serif; font-size: 14px; font-weight: 900; text-anchor: middle; fill: #ffbd31; }
      .indicator-label { font-family: "Arial Black", Arial, sans-serif; font-size: 13px; font-weight: 900; text-anchor: middle; fill: #fff2c2; }
      .accent { fill: #ff7a25; font-weight: 900; }
      .gold { fill: #ffd65b; font-weight: 900; }
      .number { font-family: "Arial Black", Arial, sans-serif; font-size: 27px; font-weight: 900; text-anchor: middle; dominant-baseline: middle; fill: #17110b; }
      .value { font-family: "Arial Black", Arial, sans-serif; font-size: 20px; font-weight: 900; text-anchor: middle; dominant-baseline: middle; fill: #fff3c7; }
      .value-arrow { font-family: "Arial Black", Arial, sans-serif; font-size: 28px; font-weight: 900; text-anchor: middle; dominant-baseline: middle; fill: #ff9a25; }
    </style>
  </defs>

  <!-- Backglass-inspired cabinet border and tavern field -->
  <rect width="1800" height="975" fill="#050706"/>
  <rect x="12" y="12" width="1776" height="951" rx="19" fill="url(#wood)" stroke="#ef9f21" stroke-width="11"/>
  <rect x="28" y="28" width="1744" height="919" rx="13" fill="none" stroke="#070807" stroke-width="10"/>
  <rect x="41" y="41" width="1718" height="893" rx="8" fill="none" stroke="#f8c33a" stroke-width="5"/>
  <rect x="51" y="51" width="1698" height="873" fill="url(#woodLines)" stroke="#e54b18" stroke-width="5"/>

  <!-- Compact left-aligned masthead leaves the full lower third available for the player art. -->
  <image href="scorecard-title.png" x="100" y="40" width="990" height="212" preserveAspectRatio="xMinYMid meet"/>

  <!-- Bally Midway fills the otherwise unused upper-right corner. -->
  <g transform="translate(1245 96)" filter="url(#logoShadow)">
    <text x="0" y="70" font-family="Brush Script MT, Segoe Script, cursive" font-size="88" font-style="italic" fill="#fff2c2">Bally</text>
    <text x="190" y="68" font-family="Arial Black, Arial, sans-serif" font-size="42" font-style="italic" letter-spacing="1.2" fill="#fff2c2">MIDWAY</text>
  </g>

  <!-- Four compact rules plus one tall progressive panel in the open right side. -->
  <g transform="translate(0 -90)">
  <g filter="url(#shadow)">
    <rect x="80" y="340" width="530" height="175" rx="16" fill="#083e20" fill-opacity="0.97" stroke="#e8921d" stroke-width="5"/>
    <rect x="635" y="340" width="530" height="175" rx="16" fill="#083e20" fill-opacity="0.97" stroke="#e8921d" stroke-width="5"/>
    <rect x="80" y="525" width="530" height="175" rx="16" fill="#083e20" fill-opacity="0.97" stroke="#e8921d" stroke-width="5"/>
    <rect x="635" y="525" width="530" height="175" rx="16" fill="#083e20" fill-opacity="0.97" stroke="#e8921d" stroke-width="5"/>
    <rect x="1185" y="340" width="530" height="480" rx="16" fill="#083e20" fill-opacity="0.97" stroke="#e8921d" stroke-width="5"/>
  </g>

  <!-- 1 ball: yellow -->
  <g transform="translate(15 0)">
  <circle cx="111" cy="388" r="33" fill="#e8bd27" stroke="#17110b" stroke-width="5"/>
  <circle cx="111" cy="388" r="16" fill="#fff5d4"/>
  <circle cx="99" cy="376" r="6" fill="#ffffff" opacity="0.5"/>
  <text class="number" x="111" y="390">1</text>
  <text class="rule-title" x="165" y="398">C-H-A-M-P</text>
  <g>
    <text class="indicator-count" x="145" y="438">2 TIMES</text>
    <text class="indicator-count" x="315" y="438">4 TIMES</text>
    <text class="indicator-count" x="485" y="438">6 TIMES</text>
    <rect x="80" y="445" width="130" height="62" rx="31" fill="#165b31" stroke="#e8a020" stroke-width="3"/>
    <rect x="250" y="445" width="130" height="62" rx="31" fill="#165b31" stroke="#e8a020" stroke-width="3"/>
    <rect x="420" y="445" width="130" height="62" rx="31" fill="#9f241e" stroke="#e8a020" stroke-width="3"/>
    <text class="value" x="145" y="468">2X</text>
    <text class="indicator-label" x="145" y="493">PLAYFIELD</text>
    <text class="value-arrow" x="230" y="477">&#8594;</text>
    <text class="value" x="315" y="468">3X</text>
    <text class="indicator-label" x="315" y="493">PLAYFIELD</text>
    <text class="value-arrow" x="400" y="477">&#8594;</text>
    <text class="value" x="485" y="468">OUTLANE</text>
    <text class="indicator-label gold" x="485" y="493">SPECIALS</text>
  </g>
  </g>

  <!-- 2 ball: blue -->
  <circle cx="681" cy="388" r="33" fill="#2764a5" stroke="#17110b" stroke-width="5"/>
  <circle cx="681" cy="388" r="16" fill="#fff5d4"/>
  <circle cx="669" cy="376" r="6" fill="#ffffff" opacity="0.5"/>
  <text class="number" x="681" y="390">2</text>
  <text class="rule-title" x="735" y="398">CALLED BALL</text>
  <text class="rule-copy gold" x="660" y="444">
    <tspan x="660">5K START</tspan><tspan fill="#fff2c2"> &#8226; </tspan><tspan>+5K EACH MAKE</tspan><tspan fill="#fff2c2"> &#8226; </tspan><tspan>MAX 50K</tspan>
    <tspan x="660" dy="30" fill="#fff2c2">VALUE CARRIES BETWEEN DRAINS</tspan>
  </text>

  <!-- 3 ball: red; tall combined Orbit / Spinner progressive explanation -->
  <g transform="translate(-20 0)">
  <circle cx="1251" cy="388" r="33" fill="#c52d2d" stroke="#17110b" stroke-width="5"/>
  <circle cx="1251" cy="388" r="16" fill="#fff5d4"/>
  <circle cx="1239" cy="376" r="6" fill="#ffffff" opacity="0.5"/>
  <text class="number" x="1251" y="390">3</text>
  <text class="rule-title" x="1305" y="398">PROGRESSIVE COLLECT</text>
  <text class="rule-copy" x="1470" y="441" text-anchor="middle">SINK A NEW BALL TO LIGHT EACH STAGE</text>
  <g>
    <rect x="1230" y="454" width="210" height="36" rx="18" fill="#165b31" stroke="#e8a020" stroke-width="3"/>
    <rect x="1490" y="454" width="210" height="36" rx="18" fill="#9f241e" stroke="#e8a020" stroke-width="3"/>
    <text class="value" x="1335" y="473">ORBITS</text>
    <text class="value-arrow" x="1465" y="473">&#8644;</text>
    <text class="value" x="1595" y="473">SPINNER</text>
  </g>
  <text class="section-title" x="1250" y="545">ORBITS</text>
  <line x1="1250" y1="555" x2="1690" y2="555" stroke="#d8871b" stroke-width="3"/>
  <text class="rule-copy" x="1250" y="574">
    <tspan class="gold">LEFT:</tspan><tspan> COLLECT</tspan><tspan x="1430" class="gold">RIGHT:</tspan><tspan> COLLECT + ADV. 10K</tspan>
    <tspan x="1250" dy="30">REACH </tspan><tspan class="gold">100K</tspan><tspan> TO LIGHT </tspan><tspan class="accent">SPECIAL</tspan>
    <tspan x="1250" dy="30">VALUE CARRIES BETWEEN DRAINS</tspan>
  </text>

  <text class="section-title" x="1250" y="690">SPINNER</text>
  <line x1="1250" y1="700" x2="1690" y2="700" stroke="#d8871b" stroke-width="3"/>
  <text class="rule-copy" x="1250" y="727">
    <tspan class="gold">E-I-G-H-T</tspan><tspan> INCREASES VALUE, MAX </tspan><tspan class="gold">9K PER SPIN</tspan>
    <tspan x="1250" dy="30">VALUE RESETS BETWEEN DRAINS</tspan>
  </text>
  </g>

  <!-- 4 ball: purple; discrete values with centered arrows -->
  <g transform="translate(15 0)">
  <circle cx="111" cy="563" r="33" fill="#6b3f8f" stroke="#17110b" stroke-width="5"/>
  <circle cx="111" cy="563" r="16" fill="#fff5d4"/>
  <circle cx="99" cy="551" r="6" fill="#ffffff" opacity="0.5"/>
  <text class="number" x="111" y="565">4</text>
  <text class="rule-title" x="165" y="573">BONUS X SAUCER</text>
  <g>
    <rect x="88" y="615" width="76" height="38" rx="19" fill="#165b31" stroke="#e8a020" stroke-width="3"/>
    <rect x="212" y="615" width="76" height="38" rx="19" fill="#165b31" stroke="#e8a020" stroke-width="3"/>
    <rect x="336" y="615" width="76" height="38" rx="19" fill="#165b31" stroke="#e8a020" stroke-width="3"/>
    <rect x="460" y="615" width="108" height="38" rx="19" fill="#9f241e" stroke="#e8a020" stroke-width="3"/>
    <text class="value" x="126" y="635">2X</text>
    <text class="value-arrow" x="188" y="635">&#8594;</text>
    <text class="value" x="250" y="635">3X</text>
    <text class="value-arrow" x="312" y="635">&#8594;</text>
    <text class="value" x="374" y="635">5X</text>
    <text class="value-arrow" x="436" y="635">&#8594;</text>
    <text class="value" x="514" y="635">100K</text>
  </g>
  <text class="rule-copy" x="90" y="682">PROGRESSIVE COLLECT RELIGHTS <tspan class="accent">100K</tspan></text>
  </g>

  <!-- 5 ball: orange; three deliberately separated lines -->
  <circle cx="681" cy="563" r="33" fill="#e47b22" stroke="#17110b" stroke-width="5"/>
  <circle cx="681" cy="563" r="16" fill="#fff5d4"/>
  <circle cx="669" cy="551" r="6" fill="#ffffff" opacity="0.5"/>
  <text class="number" x="681" y="565">5</text>
  <text class="rule-title" x="735" y="573">END-OF-BALL BONUS</text>
  <text class="rule-copy" x="660" y="624">
    <tspan x="660" class="gold">15K / POOL BALL SUNK</tspan><tspan x="910" fill="#fff2c2">&#8226;</tspan><tspan x="945" class="gold">120K / RACK</tspan>
    <tspan x="660" dy="26" class="gold">10K / E-I-G-H-T</tspan><tspan x="910" fill="#fff2c2">&#8226;</tspan><tspan x="945" class="gold">50K / B-A-L-L</tspan>
    <tspan x="660" dy="26">VALUE CARRIES BETWEEN DRAINS</tspan>
  </text>
  </g>

  <!-- Pool-table field and backglass-style player -->
  <g clip-path="url(#playerClip)">
    <image href="scorecard-pool-player.png" x="170" y="520" width="1250" height="417" preserveAspectRatio="xMidYMid meet"/>
    <!-- Continue clean source-art bands over the illustration's tapered end. -->
    <g clip-path="url(#tableExtensionClip)">
      <svg x="1396" y="845" width="353" height="37.41" viewBox="2075 565 50 65" preserveAspectRatio="none"><image href="scorecard-pool-player.png" width="2172" height="724"/></svg>
      <svg x="1396" y="882.41" width="115.10" height="35.59" viewBox="950 665 200 59" preserveAspectRatio="none"><image href="scorecard-pool-player.png" width="2172" height="724"/></svg>
      <svg x="1511.10" y="882.41" width="115.10" height="35.59" viewBox="950 665 200 59" preserveAspectRatio="none"><image href="scorecard-pool-player.png" width="2172" height="724"/></svg>
      <svg x="1626.20" y="882.41" width="115.10" height="35.59" viewBox="950 665 200 59" preserveAspectRatio="none"><image href="scorecard-pool-player.png" width="2172" height="724"/></svg>
      <svg x="1741.30" y="882.41" width="115.10" height="35.59" viewBox="950 665 200 59" preserveAspectRatio="none"><image href="scorecard-pool-player.png" width="2172" height="724"/></svg>
    </g>
  </g>

  <g transform="translate(0 -18)">
  <path d="M70,850 H380 L410,890 380,930 H70 L99,890 Z" fill="#26140c" fill-opacity="0.92" stroke="#e99920" stroke-width="4"/>
  <path d="M420,850 H730 L760,890 730,930 H420 L449,890 Z" fill="#26140c" fill-opacity="0.92" stroke="#e99920" stroke-width="4"/>
  <path d="M770,850 H1080 L1110,890 1080,930 H770 L799,890 Z" fill="#26140c" fill-opacity="0.92" stroke="#e99920" stroke-width="4"/>

  <text x="240" y="880" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="15" letter-spacing="0.5" fill="#ffbd35">COMPLETE B-A-L-L</text>
  <text x="240" y="907" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="14" letter-spacing="0.3" fill="#fff2c2">FOR EXTRA BALL + SPECIALS</text>

  <text x="590" y="880" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="14" letter-spacing="0.3" fill="#ffbd35">COMPLETE 2 OR MORE RACKS</text>
  <text x="590" y="907" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="14" letter-spacing="0.3" fill="#fff2c2">FOR SPECIALS</text>

  <text x="940" y="880" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="15" letter-spacing="0.5" fill="#ffbd35">ALL SPECIALS</text>
  <text x="940" y="907" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="14" letter-spacing="0.3" fill="#fff2c2">250K &#215; PLAYFIELD</text>
  </g>
</svg>
